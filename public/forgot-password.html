<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Восстановление пароля — MarketRadar</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="center-wrap">
    <div class="card auth-card">
      <h1>MarketRadar</h1>
      <p class="lede">Укажите e-mail, с которым регистрировались — пришлём ссылку для восстановления пароля.</p>

      <form id="forgot-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="error-msg" id="error"></div>
        <div class="success-msg" id="success" style="display:none"></div>
        <button type="submit" id="submit-btn">Отправить ссылку</button>
      </form>

      <p class="lede" style="margin-top:16px"><a href="/index.html">← Назад ко входу</a></p>
    </div>
  </div>

  <script src="/js/forgot-password.js"></script>
</body>
</html>
