<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новый пароль — MarketRadar</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="center-wrap">
    <div class="card auth-card">
      <h1>MarketRadar</h1>
      <p class="lede">Придумайте новый пароль для входа.</p>

      <form id="reset-form">
        <div class="field">
          <label for="password">Новый пароль</label>
          <input type="password" id="password" autocomplete="new-password" required minlength="8">
        </div>
        <div class="error-msg" id="error"></div>
        <button type="submit" id="submit-btn">Сохранить пароль</button>
      </form>
    </div>
  </div>

  <script src="/js/reset-password.js"></script>
</body>
</html>
