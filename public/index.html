<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — MarketRadar</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="center-wrap">
    <div class="card auth-card">
      <h1>MarketRadar</h1>
      <p class="lede">Сервис для продавцов маркетплейсов: узнаёт, какую скидку сейчас даёт площадка поверх вашей цены, и растёт в полноценный набор инструментов для селлера.</p>

      <div class="tabs">
        <button type="button" id="tab-login" class="active">Вход</button>
        <button type="button" id="tab-register">Регистрация</button>
      </div>

      <form id="auth-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input type="password" id="password" autocomplete="current-password" required minlength="8">
        </div>
        <div class="error-msg" id="error"></div>
        <button type="submit" id="submit-btn">Войти</button>
      </form>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
